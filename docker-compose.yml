# Local development stack. The api service hot-reloads from ./backend/app.
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://contentpilot:contentpilot@postgres:5432/contentpilot
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    MEDIA_ROOT: /data/media
  volumes:
    - ./backend/app:/app/app
    - ./backend/migrations:/app/migrations
    - ./backend/alembic.ini:/app/alembic.ini
    # Generated images: written by workers, served by the API at /media.
    - media_data:/data/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: contentpilot
      POSTGRES_PASSWORD: contentpilot
      POSTGRES_DB: contentpilot
    ports:
      - "5433:5432"   # 5432 is taken by a local PostgreSQL service
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentpilot -d contentpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # 6379 is taken by a WSL process on this PC
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies database migrations, then exits. Everything else waits for it.
  migrate:
    <<: *backend
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    healthcheck:
      disable: true

  beat:
    <<: *backend
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true

volumes:
  postgres_data:
  media_data:
